name: Build NovaSMP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate Source & Assets
        run: python build.py
      - name: Build JAR
        working-directory: NovaSMP-Plugin
        run: mvn clean package -B
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaSMP-Completed-Files
          path: |
            NovaSMP-Plugin/target/*.jar
            NovaSMP-ResourcePack.zip
